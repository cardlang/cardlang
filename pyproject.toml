[project]
name = "cardlang"
version = "0.1.0"
description = "The CardLang toolchain: reference checkers, compiler, reference interpreter, Python VM, harness, command line, language server and debug adapter"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "cffi>=2.1.1",
]

[project.scripts]
clc = "cardlang.cli:entry"
cardlang-lsp = "cardlang.lsp.server:main"
cardlang-dap = "cardlang.dap.adapter:main"

[project.entry-points."pygments.lexers"]
cardlang = "cardlang.highlight:CardLangLexer"
scenario = "cardlang.highlight:ScenarioLexer"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fido2>=2.2.1",
    "mkdocs-material>=9.8.2",
]
reader = [
    "pyscard>=2.3.2",
]
